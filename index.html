<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Criterium</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#F2F6F7" />
    <meta name="color-scheme" content="light" />
    <!-- Instalable como app (Mac: Archivo → Agregar al Dock en Safari; iPhone: Compartir → Añadir a pantalla de inicio) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Criterium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Protocolos odontológicos con evidencia trazable, casos clínicos y revisión por pares." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (Windows y Android) sin bloquear el primer dibujo: en Apple se usa San Francisco -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" /></noscript>
    <!-- Pantalla de carga: va aquí (no en React) para que se vea apenas abre la app, antes de que cargue el código.
         Colores con los mismos valores de los tokens de index.css, que todavía no están cargados. -->
    <style>
      #carga{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 16px;text-align:center;
        background:radial-gradient(60% 45% at 50% 42%,#F0F6F7 0%,#FFFFFF 70%);transition:opacity .45s ease,visibility .45s;
        font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif}
      #carga.fuera{opacity:0;visibility:hidden;pointer-events:none}
      #carga.fuera .c-ficha{transform:scale(1.06);transition:transform .45s ease}
      .c-ficha{width:132px;height:132px;margin:-14px 0}
      .c-ficha svg{display:block;width:100%;height:100%;overflow:visible}
      /* El logo (src/marca.js, grilla de 64): la sonda menta recorre el anillo dibujando la C y se detiene en su lugar, en la abertura */
      .c-c{stroke-dasharray:100 200;stroke-dashoffset:100;animation:c-traza .65s cubic-bezier(.55,.05,.3,1) .1s forwards}
      .c-sonda,.c-halo{transform-box:view-box;transform-origin:32px 32px}
      .c-sonda{opacity:0;animation:c-recorre .65s cubic-bezier(.55,.05,.3,1) .1s forwards,c-llega .22s cubic-bezier(.2,.8,.2,1) .75s forwards}
      .c-halo{opacity:0;fill:none;stroke:#5CCFC0;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:c-late 1.6s ease-out .9s infinite}
      .c-marca{font-size:34px;font-weight:700;letter-spacing:-.032em;line-height:1;display:flex;color:#0B1F27}
      .c-marca span{display:inline-block;animation:c-letra .4s cubic-bezier(.2,.8,.2,1) both}
      .c-lema{margin:0;font-size:14px;color:#5F6C73;letter-spacing:.005em;animation:c-letra .45s ease .9s both}
      @keyframes c-traza{to{stroke-dashoffset:0}}
      @keyframes c-recorre{0%{opacity:0;transform:rotate(-50deg)}10%{opacity:1}100%{opacity:1;transform:rotate(-310deg)}}
      @keyframes c-llega{from{opacity:1;transform:rotate(-310deg)}to{opacity:1;transform:rotate(-360deg)}}
      @keyframes c-late{0%{opacity:.8;transform:scale(1)}60%{opacity:0;transform:scale(2.8)}100%{opacity:0;transform:scale(2.8)}}
      @keyframes c-letra{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
      .c-lento{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px;font-size:13.5px;color:#4E5A60;animation:c-letra .4s ease both}
      .c-lento p{margin:0}.c-lento div{display:flex;gap:8px}
      .c-lento button{font:inherit;font-weight:600;border-radius:10px;padding:8px 16px;border:1px solid #C7D0D3;background:#fff;color:#121A1E;cursor:pointer}
      .c-lento button#c-reintentar{background:#2C6674;border-color:#2C6674;color:#fff}
      @media (prefers-reduced-motion:reduce){#carga *{animation:none!important}.c-c{stroke-dashoffset:0}.c-sonda{opacity:1}.c-halo{opacity:0}}
    </style>
  </head>
  <body>
    <div id="carga" role="status" aria-label="Cargando Criterium">
      <div class="c-ficha">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path class="c-c" d="M41.32 20.89A14.5 14.5 0 1 0 41.32 43.11" pathLength="100" fill="none" stroke="#0B1F27" stroke-width="9" />
          <g class="c-sonda"><circle cx="46.5" cy="32" r="4.6" fill="#3DBFAE" /></g>
          <circle class="c-halo" cx="46.5" cy="32" r="4.6" />
        </svg>
      </div>
      <div class="c-marca" aria-hidden="true"><span style="animation-delay:0.55s">C</span><span style="animation-delay:0.58s">r</span><span style="animation-delay:0.61s">i</span><span style="animation-delay:0.64s">t</span><span style="animation-delay:0.67s">e</span><span style="animation-delay:0.70s">r</span><span style="animation-delay:0.73s">i</span><span style="animation-delay:0.76s">u</span><span style="animation-delay:0.79s">m</span></div>
      <p class="c-lema">Procedimientos clínicos basados en la evidencia</p>
    </div>
    <script>
      // La app llama a criteriumListo() cuando sabe si hay sesión. La pantalla espera lo justo para que se vea la entrada (1,3 s).
      // Si a los 8 s sigue aquí (red caída, archivo que no cargó), ofrece reintentar o seguir, para que nadie quede pegado.
      (function () {
        var t0 = Date.now(), quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
        function sacar(espera) {
          var el = document.getElementById('carga');
          if (!el || el.dataset.sale) return;
          el.dataset.sale = '1';
          setTimeout(function () {
            el.classList.add('fuera');
            setTimeout(function () { el.remove(); }, 450);
          }, espera);
        }
        window.criteriumListo = function () { sacar(quieto ? 0 : Math.max(0, 1300 - (Date.now() - t0))); };
        setTimeout(function () {
          var el = document.getElementById('carga');
          if (!el || el.dataset.sale) return;
          var d = document.createElement('div');
          d.className = 'c-lento';
          d.innerHTML = '<p>Está tardando más de lo normal. Revisa tu conexión.</p><div><button type="button" id="c-reintentar">Reintentar</button><button type="button" id="c-seguir">Continuar</button></div>';
          el.appendChild(d);
          document.getElementById('c-reintentar').onclick = function () { location.reload(); };
          document.getElementById('c-seguir').onclick = function () { sacar(0); };
        }, 8000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
